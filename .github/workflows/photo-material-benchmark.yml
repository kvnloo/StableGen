name: Photo material offline benchmark tests
on:
  pull_request:
    paths:
      - 'experiments/photo_material/**'
      - '.github/workflows/photo-material-benchmark.yml'
  workflow_dispatch:
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'Pillow>=10,<12'
      - name: Run synthetic contract tests (not real GPU benchmarks)
        run: python -m unittest discover -s experiments/photo_material -p 'test_*.py' -v
